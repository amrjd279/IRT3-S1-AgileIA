name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check backend/

      - name: Format check (Ruff)
        run: ruff format --check backend/

      - name: Tests
        env:
          GEMINI_API_KEY: dummy-key-for-ci
        run: pytest -v
